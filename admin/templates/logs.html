{% extends "base.html" %}

{% block page_title %}Atelier VEO | Системный журнал службы{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <div style="font-size: 0.875rem; color: var(--text-dim);">
        Последние 150 записей системного журнала (systemd journalctl / bot.log)
    </div>
    <div style="display: flex; gap: 0.5rem;">
        <button onclick="location.reload();" class="btn btn-secondary" style="padding: 0.4rem 0.85rem; font-size: 0.8rem;">
            🔄 Обновить логи
        </button>
    </div>
</div>

<div class="terminal-window">{{ logs }}</div>
{% endblock %}

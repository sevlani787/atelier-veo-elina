<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Элин Admin{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <span class="logo-text">Элин Admin</span>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
                    <span class="icon">📊</span> Дашборд
                </a>
                <a href="/settings" class="nav-item {% if request.url.path == '/settings' %}active{% endif %}">
                    <span class="icon">⚙️</span> Настройки
                </a>
                <a href="/users" class="nav-item {% if request.url.path == '/users' %}active{% endif %}">
                    <span class="icon">👥</span> Пользователи
                </a>
                <a href="/persona" class="nav-item {% if request.url.path == '/persona' %}active{% endif %}">
                    <span class="icon">🎭</span> Память (Образ)
                </a>
                <a href="/broadcast" class="nav-item {% if request.url.path == '/broadcast' %}active{% endif %}">
                    <span class="icon">📢</span> Рассылка
                </a>
                <a href="/logs" class="nav-item {% if request.url.path == '/logs' %}active{% endif %}">
                    <span class="icon">📜</span> Логи
                </a>
            </nav>
            <div class="user-info">
                <span class="username">👤 {{ username }}</span>
                <a href="#" class="logout">Выйти</a>
            </div>
        </aside>
        
        <main class="content">
            <header class="top-header">
                <h1>{% block page_title %}Панель управления{% endblock %}</h1>
                <div class="header-actions">
                    <span class="time" id="current-time">00:00:00</span>
                </div>
            </header>
            
            <div class="page-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
